<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Vynora event discovery and ticketing platform</title>
  <desc id="desc">Editorial event discovery interface with search, category chips, event cards and booking information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#27324a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/><stop offset="1" stop-color="#ffbd8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f4efe8"/>
  <rect x="70" y="70" width="1460" height="860" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="140" cy="140" r="13" fill="#ff8a5b"/><text x="170" y="151" fill="#f7f3ee" font-family="Arial, sans-serif" font-size="30" font-weight="700">VYNORA</text>
  <text x="140" y="235" fill="#f7f3ee" font-family="Georgia, serif" font-size="72" font-weight="700">Find something worth</text>
  <text x="140" y="315" fill="#ffb38f" font-family="Georgia, serif" font-size="72" font-weight="700">showing up for.</text>
  <rect x="140" y="360" width="880" height="72" rx="16" fill="#fff" opacity=".96"/>
  <circle cx="175" cy="396" r="13" fill="none" stroke="#566074" stroke-width="3"/><path d="M185 406l13 13" stroke="#566074" stroke-width="3" stroke-linecap="round"/>
  <text x="220" y="407" fill="#566074" font-family="Arial, sans-serif" font-size="24">Search concerts, workshops, festivals...</text>
  <g font-family="Arial, sans-serif" font-size="19">
    <rect x="140" y="460" width="128" height="44" rx="22" fill="url(#accent)"/><text x="173" y="489" fill="#171b25">All events</text>
    <rect x="280" y="460" width="128" height="44" rx="22" fill="#303a52"/><text x="309" y="489" fill="#e9edf5">Music</text>
    <rect x="420" y="460" width="145" height="44" rx="22" fill="#303a52"/><text x="448" y="489" fill="#e9edf5">Workshops</text>
    <rect x="577" y="460" width="128" height="44" rx="22" fill="#303a52"/><text x="608" y="489" fill="#e9edf5">Sports</text>
  </g>
  <g>
    <rect x="140" y="555" width="430" height="285" rx="22" fill="#fff"/>
    <rect x="160" y="575" width="390" height="150" rx="16" fill="#ffdbc8"/>
    <circle cx="455" cy="620" r="42" fill="#121826" opacity=".9"/><path d="M438 620h34M455 603v34" stroke="#ffb38f" stroke-width="6" stroke-linecap="round"/>
    <text x="160" y="770" fill="#121826" font-family="Arial, sans-serif" font-size="25" font-weight="700">Night Market Sessions</text>
    <text x="160" y="802" fill="#566074" font-family="Arial, sans-serif" font-size="19">Lahore · Oct 18 · From PKR 2,500</text>
  </g>
  <g>
    <rect x="595" y="555" width="430" height="285" rx="22" fill="#fff"/>
    <rect x="615" y="575" width="390" height="150" rx="16" fill="#d8e2ff"/>
    <circle cx="910" cy="620" r="42" fill="#121826" opacity=".9"/><path d="M892 620h36M910 602v36" stroke="#a9baff" stroke-width="6" stroke-linecap="round"/>
    <text x="615" y="770" fill="#121826" font-family="Arial, sans-serif" font-size="25" font-weight="700">Design Futures Lab</text>
    <text x="615" y="802" fill="#566074" font-family="Arial, sans-serif" font-size="19">Karachi · Nov 02 · 120 seats</text>
  </g>
  <g>
    <rect x="1050" y="555" width="400" height="285" rx="22" fill="#fff"/>
    <text x="1080" y="615" fill="#121826" font-family="Arial, sans-serif" font-size="20" font-weight="700">Smart recommendations</text>
    <rect x="1080" y="645" width="340" height="54" rx="12" fill="#f4efe8"/><text x="1100" y="679" fill="#121826" font-family="Arial, sans-serif" font-size="18">Based on your activity</text>
    <rect x="1080" y="715" width="150" height="46" rx="23" fill="#121826"/><text x="1112" y="745" fill="#fff" font-family="Arial, sans-serif" font-size="17">Explore events</text>
  </g>
  <text x="140" y="885" fill="#aeb7ca" font-family="Arial, sans-serif" font-size="18">React 18 · TypeScript · Zustand · TanStack Query · Tailwind CSS · Framer Motion</text>
</svg>
